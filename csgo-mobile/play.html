st $=id=>document.getElementById(id);if(!window.THREE){$('msg').textContent='Three.js 加载失败，请检查网络后刷新';return}$('msg').textContent='加载完成，可以开始';const touch=matchMedia('(pointer:coarse)').matches||navigator.maxTouchPoints>0;const scene=new THREE.Scene();scene.background=new THREE.Color(0x778995);scene.fog=new THREE.Fog(0x778995,25,65);const camera=new THREE.PerspectiveCamera(72,innerWidth/innerHeight,.08,100);camera.rotation.order='YXZ';camera.position.set(0,1.65,14);const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);$('game').appendChild(renderer.domElement);scene.add(new THREE.HemisphereLight(0xd7e7f0,0x51473e,2));const sun=new THREE.DirectionalLight(0xffefd0,2);sun.position.set(-10,20,10);scene.add(sun);const world=new THREE.Group();scene.add(world);const mat=c=>new THREE.MeshStandardMaterial({color:c,roughness:.9});const ground=new THREE.Mesh(new THREE.PlaneGeometry(80,80),mat(0x8b887c));ground.rotation.x=-Math.PI/2;world.add(ground);const coll=[];function box(x,z,w,h,d,c){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(c||0x77776e));m.position.set(x,h/2,z);world.add(m);coll.push(new THREE.Box3().setFromObject(m));return m}box(0,-29,60,4,2);box(0,29,60,4,2);box(-29,0,2,4,60);box(29,0,2,4,60);[[-17,-13,9,4,4,0x9d927f],[-17,7,5,3,12,0x667376],[17,-15,10,4,4,0x9a8d75],[18,7,5,3,12,0x697477],[0,-7,5,3,10,0x77786f],[0,12,10,3,4,0x87775f],[-9,18,7,2.5,4,0x76614d],[10,19,7,2.5,4,0x76614d]].forEach(a=>box(...a));const enemies=[];const spawn=[[-22,-20],[-10,-22],[8,-22],[22,-15],[23,5],[18,22],[0,23],[-20,20],[-22,0],[10,5]];function makeEnemy(x,z){const g=new THREE.Group();g.position.set(x,0,z);g.userData={hp:100,alive:true,baseX:x,baseZ:z,t:Math.random()*8,shot:1+Math.random()*2};const body=new THREE.Mesh(new THREE.BoxGeometry(.65,1.05,.38),mat(0x64332e));body.position.y=1.02;const vest=new THREE.Mesh(new THREE.BoxGeometry(.73,.55,.43),mat(0x303a39));vest.position.y=1.15;const head=new THREE.Mesh(new THREE.SphereGeometry(.25,12,9),mat(0xc69b76));head.position.y=1.75;head.userData.head=true;g.add(body,vest,head);g.traverse(o=>{if(o.isMesh)o.userData.enemy=g});world.add(g);enemies.push(g)}function resetEnemies(){enemies.splice(0).forEach(e=>world.remove(e));spawn.slice().sort(()=>Math.random()-.5).slice(0,6).forEach(p=>makeEnemy(p[0],p[1]))}resetEnemies();const gun=new THREE.Group();camera.add(gun);scene.add(camera);const gb=new THREE.Mesh(new THREE.BoxGeometry(.18,.18,.75),new THREE.MeshStandardMaterial({color:0x30363b,metalness:.5,roughness:.4}));gb.position.set(.25,-.22,-.58);gun.add(gb);const ray=new THREE.Raycaster();ray.far=70;const center=new THREE.Vector2(0,0),keys={};let running=false,yaw=0,pitch=0,hp=100,kills=0,ammo=30,reserve=90,reloading=false,held=false,lastShot=0,timeLeft=90,acc=0,mv={x:0,y:0};function hud(){$('score').textContent='击杀 '+kills+' / 8';$('hp').innerHTML=Math.max(0,Math.ceil(hp))+' <small>HP</small>';$('ammo').innerHTML=ammo+' <small>/ '+reserve+'</small>'}function canMove(x,z){const r=.35,b=new THREE.Box3(new THREE.Vector3(x-r,.1,z-r),new THREE.Vector3(x+r,1.9,z+r));return Math.abs(x)<27.5&&Math.abs(z)<27.5&&!coll.some(c=>c.intersectsBox(b))}function end(win){running=false;held=false;$('touch').style.display='none';$('menu').style.display='grid';$('msg').textContent=win?'胜利！你击杀了 8 个机器人':'本回合结束，点击开始重新挑战';document.querySelector('.go').textContent='重新开始';document.exitPointerLock&&document.exitPointerLock()}function damage(v){hp-=v;hud();if(hp<=0)end(false)}function shoot(){if(!running||reloading)return;const now=performance.now();if(now-lastShot<120)return;lastShot=now;if(ammo<=0)return;ammo--;hud();gun.position.z=.06;setTimeout(()=>gun.position.z=0,45);ray.setFromCamera(center,camera);const targets=[];enemies.forEach(e=>e.userData.alive&&e.traverse(o=>o.isMesh&&targets.push(o)));const hit=ray.intersectObjects(targets,false)[0];if(hit){const e=hit.object.userData.enem wn=e=>{e.preventDefault();held=true;shoot()};$('fire').onpointerup=$('fire').onpointercancel=()=>held=false;$('reload').onpointerdown=reload;addEventListener('keydown',e=>{keys[e.code]=true;if(e.code==='KeyR')reload()});addEventListener('keyup',e=>keys[e.code]=false);renderer.domElement.addEventListener('click',()=>{if(running&&!touch&&document.pointerLockElement!==renderer.domElement)renderer.domElement.requestPointerLock()});addEventListener('mousemove',e=>{if(running&&!touch&&document.pointerLockElement===renderer.domElement){yaw-=e.movementX*.0023;pitch=Math.max(-1.15,Math.min(1.15,pitch-e.movementY*.0023))}});addEventListener('mousedown',e=>{if(e.button===0){held=true;shoot()}});addEventListener('mouseup',()=>held=false);const clock=new THREE.Clock();function loop(){requestAnimationFrame(loop);const dt=Math.min(clock.getDelta(),.033);if(running){camera.rotation.set(pitch,yaw,0);let x=touch?mv.x:(keys.KeyD?1:0)-(keys.KeyA?1:0),z=touch?mv.y:(keys.KeyS?1:0)-(keys.KeyW?1:0),l=Math.hypot(x,z);if(l>1){x/=l;z/=l}const f=new THREE.Vector3(-Math.sin(yaw),0,-Math.cos(yaw)),r=new THREE.Vector3(Math.cos(yaw),0,-Math.sin(yaw)),v=f.multiplyScalar(-z).addScaledVector(r,x).multiplyScalar(5*dt);const nx=camera.position.x+v.x,nz=camera.position.z+v.z;if(canMove(nx,camera.position.z))camera.position.x=nx;if(canMove(camera.position.x,nz))camera.position.z=nz;if(held)shoot();enemies.forEach((e,i)=>{if(!e.userData.alive)return;const u=e.userData;u.t+=dt*.6;const tx=u.baseX+Math.sin(u.t+i)*1.8,tz=u.baseZ+Math.cos(u.t*.8+i)*1.8,dx=tx-e.position.x,dz=tz-e.position.z,d=Math.hypot(dx,dz)||1;const ex=e.position.x+dx/d*dt*.7,ez=e.position.z+dz/d*dt*.7;if(canMove(ex,ez)){e.position.x=ex;e.position.z=ez}e.lookAt(camera.position.x,1.1,camera.position.z);u.shot-=dt;const dist=e.position.distanceTo(camera.position);if(dist<20&&u.shot<=0){u.shot=1.3+Math.random()*1.5;if(Math.random()<.32)damage(4+Math.random()*5)}});acc+=dt;if(acc>=.2){timeLeft-=acc;acc=0;if(timeLeft<=0){timeLeft=0;end(false)}$(
